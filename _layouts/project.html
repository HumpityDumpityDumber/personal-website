<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ page.title }}</title>
  
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Iosevka+Charon+Mono:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&family=Libre+Barcode+128+Text&family=Noto+Sans+JP:wght@100..900&display=swap">

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background-color: #E5DEEA;
      color: #5D3387;
      margin: 0;
      font-family: 'Iosevka Charon Mono', monospace;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #5D3387;
      color: #E5DEEA;
      font-family: "Noto Sans JP", sans-serif;
      font-weight: 700;
      font-size: clamp(1.5rem, 3vw, 2.5rem);
      padding: 2rem 3rem;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    main {
      flex: 1;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
      padding: 3rem 1.5rem;
      box-sizing: border-box;
      line-height: 1.6;
    }

    main h1, main h2, main h3 {
      font-family: "Noto Sans JP", sans-serif;
      color: #5D3387;
    }

    .other-projects-section {
      background: #5D3387;
      padding: 3rem 0;
      width: 100%;
    }

    .other-projects-title {
      color: #E5DEEA;
      font-family: "Noto Sans JP", sans-serif;
      font-weight: 700;
      margin: 0 0 1.5rem 3rem;
      font-size: 1.5rem;
    }

    .scroll-container {
      display: flex;
      gap: 1.5rem;
      overflow-x: auto;
      padding: 0 3rem 1.5rem 3rem;
      scroll-snap-type: x mandatory;
      scrollbar-width: thin;
      scrollbar-color: #C9BAD3 transparent;
    }

    .scroll-container::-webkit-scrollbar {
      height: 6px;
    }
    .scroll-container::-webkit-scrollbar-thumb {
      background-color: #C9BAD3;
      border-radius: 10px;
    }

    .portfolio-card {
      flex: 0 0 clamp(16rem, 25vw, 24rem);
      scroll-snap-align: start;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
    }

    .card-thumb {
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      border-radius: 1.5rem;
      position: relative;
      aspect-ratio: 16 / 10;
      background-color: #C9BAD3;
      color: #5D3387;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      font-weight: 500;
      width: 100%;
      overflow: hidden;
    }

    .card-thumb::after {
      content: "view more >";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(40, 40, 40, 0.85) 0%, rgba(40, 40, 40, 0) 60%);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 1.25rem;
      color: #E5DEEA;
      font-size: 1.1rem;
      font-weight: 500;
      letter-spacing: 0.05em;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    .portfolio-card:hover .card-thumb::after {
      opacity: 1;
    }

    .card-thumb img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: transform 0.3s ease;
    }

    .portfolio-card:hover .card-thumb img {
      transform: scale(1.03);
    }

    .card-info {
      height: fit-content;
      padding: 1.25rem 0.5rem;
    }

    .card-info h3 {
      margin: 0 0 0.5rem 0;
      color: #C9BAD3;
      font-size: 1.2rem;
      font-weight: 700;
    }

    .card-info p {
      margin: 0;
      color: #9d83af;
      font-size: 0.85rem;
    }

    footer {
      background-color: #E5DEEA;
      color: #787878;
      text-align: center;
      padding: 2rem;
      font-size: 0.85rem;
      border-top: 1px solid rgba(93, 51, 135, 0.1);
    }

    @media (max-width: 700px) {
      header { padding: 1.5rem; }
      .other-projects-title { margin-left: 1.5rem; }
      .scroll-container { padding: 0 1.5rem 1rem 1.5rem; }
      .portfolio-card { flex: 0 0 15rem; }
    }
  </style>
</head>
<body>

  <header>
    {{ page.title }}
  </header>

  <main>
    {{ content }}
  </main>

  <section class="other-projects-section">
    <div class="other-projects-title">My other projects:</div>
    <div class="scroll-container">
      {% for post in site.posts %}
        {% unless post.url == page.url %}
          <a href="{{ post.url | relative_url }}" class="portfolio-card">
            <div class="card-thumb">
              {% if post.image %}
                <img src="{{ post.image | relative_url }}" alt="{{ post.title }}">
              {% else %}
                <span>{{ post.title }}</span>
              {% endif %}
            </div>
            <div class="card-info">
              <h3>{{ post.title }}</h3>
              <p>{{ post.description | default: post.excerpt | strip_html | truncate: 75 }}</p>
            </div>
          </a>
        {% endunless %}
      {% endfor %}
    </div>
  </section>

</body>
</html>
